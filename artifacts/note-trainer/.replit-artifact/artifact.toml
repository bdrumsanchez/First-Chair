kind = "web"
previewPath = "/"
title = "Note Trainer"
version = "1.0.0"
id = "artifacts/note-trainer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22154

[services.development]
run = "pnpm --filter @workspace/note-trainer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/note-trainer", "run", "build" ]
publicDir = "artifacts/note-trainer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22154"
BASE_PATH = "/"
