<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Speed-Trainer</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback, useRef, useEffect } = React;

    // ============ NOTE DATA ============
    const NOTE_NAMES = ["A", "B", "C", "D", "E", "F", "G"];
    
    const notePositionMap = {
      "G2": 150, "A2": 145, "B2": 140, "C3": 135, "D3": 130, "E3": 125, "F3": 120,
      "G3": 115, "A3": 110, "B3": 105, "C4": 100, "D4": 95, "E4": 90, "F4": 85,
      "G4": 80, "A4": 75, "B4": 70, "C5": 65, "D5": 60, "E5": 55, "F5": 50, "G5": 45, "A5": 40,
    };

    const LINE_SPACING = 10;
    const TREBLE_TOP_Y = 50;
    const BASS_BOTTOM_Y = 150;

    const STAFF_CONFIG = {
      lineSpacing: LINE_SPACING,
      trebleLinesY: [50, 60, 70, 80, 90],
      bassLinesY: [110, 120, 130, 140, 150],
      trebleTopY: TREBLE_TOP_Y,
      trebleBottomY: TREBLE_TOP_Y + LINE_SPACING * 4,
      bassTopY: BASS_BOTTOM_Y - LINE_SPACING * 4,
      bassBottomY: BASS_BOTTOM_Y,
      middleCY: 100,
    };

    function getNoteY(name, octave, accidental = null) {
      const key = `${name}${octave}`;
      const baseY = notePositionMap[key] ?? 100;
      if (accidental === "sharp") return baseY - 5;
      if (accidental === "flat") return baseY + 5;
      return baseY;
    }

    function getLedgerLines(name, octave, accidental = null) {
      const y = getNoteY(name, octave, accidental);
      const lines = [];
      if (y >= 100) {
        for (let ly = 100; ly <= y + 5; ly += LINE_SPACING) {
          if (ly >= 100 && ly <= 150 && (ly < 110 || ly > 120)) lines.push(ly);
        }
      }
      if (y < 50) {
        for (let ly = 50 - LINE_SPACING; ly >= y - 5; ly -= LINE_SPACING) {
          lines.push(ly);
        }
      }
      if (y > 150) {
        for (let ly = 150 + LINE_SPACING; ly <= y + 5; ly += LINE_SPACING) {
          lines.push(ly);
        }
      }
      return [...new Set(lines)].sort((a, b) => a - b);
    }

    const ALL_NOTES = [
      { name: "G", octave: 2, accidental: "natural", clef: "bass" },
      { name: "A", octave: 2, accidental: "natural", clef: "bass" },
      { name: "B", octave: 2, accidental: "natural", clef: "bass" },
      { name: "C", octave: 3, accidental: "natural", clef: "bass" },
      { name: "D", octave: 3, accidental: "natural", clef: "bass" },
      { name: "E", octave: 3, accidental: "natural", clef: "bass" },
      { name: "F", octave: 3, accidental: "natural", clef: "bass" },
      { name: "G", octave: 3, accidental: "natural", clef: "bass" },
      { name: "A", octave: 3, accidental: "natural", clef: "bass" },
      { name: "B", octave: 3, accidental: "natural", clef: "bass" },
      { name: "C", octave: 4, accidental: "natural", clef: "treble" },
      { name: "D", octave: 4, accidental: "natural", clef: "treble" },
      { name: "E", octave: 4, accidental: "natural", clef: "treble" },
      { name: "F", octave: 4, accidental: "natural", clef: "treble" },
      { name: "G", octave: 4, accidental: "natural", clef: "treble" },
      { name: "A", octave: 4, accidental: "natural", clef: "treble" },
      { name: "B", octave: 4, accidental: "natural", clef: "treble" },
      { name: "C", octave: 5, accidental: "natural", clef: "treble" },
      { name: "D", octave: 5, accidental: "natural", clef: "treble" },
      { name: "E", octave: 5, accidental: "natural", clef: "treble" },
      { name: "F", octave: 5, accidental: "natural", clef: "treble" },
      { name: "G", octave: 5, accidental: "natural", clef: "treble" },
      { name: "A", octave: 5, accidental: "natural", clef: "treble" },
      // Sharps
      { name: "C", octave: 4, accidental: "sharp", clef: "treble" },
      { name: "D", octave: 4, accidental: "sharp", clef: "treble" },
      { name: "F", octave: 4, accidental: "sharp", clef: "treble" },
      { name: "G", octave: 4, accidental: "sharp", clef: "treble" },
      { name: "A", octave: 4, accidental: "sharp", clef: "treble" },
      { name: "C", octave: 5, accidental: "sharp", clef: "treble" },
      { name: "D", octave: 5, accidental: "sharp", clef: "treble" },
      { name: "F", octave: 5, accidental: "sharp", clef: "treble" },
      { name: "G", octave: 5, accidental: "sharp", clef: "treble" },
      { name: "A", octave: 5, accidental: "sharp", clef: "treble" },
      // Flats
      { name: "C", octave: 4, accidental: "flat", clef: "treble" },
      { name: "D", octave: 4, accidental: "flat", clef: "treble" },
      { name: "E", octave: 4, accidental: "flat", clef: "treble" },
      { name: "F", octave: 4, accidental: "flat", clef: "treble" },
      { name: "G", octave: 4, accidental: "flat", clef: "treble" },
      { name: "A", octave: 4, accidental: "flat", clef: "treble" },
      { name: "B", octave: 4, accidental: "flat", clef: "treble" },
      { name: "C", octave: 5, accidental: "flat", clef: "treble" },
      { name: "D", octave: 5, accidental: "flat", clef: "treble" },
      { name: "E", octave: 5, accidental: "flat", clef: "treble" },
    ];

    function getRandomNote(clefFilter = "both", accidentalFilter = "all") {
      let pool = ALL_NOTES;
      if (clefFilter === "treble") pool = pool.filter(n => n.clef === "treble");
      else if (clefFilter === "bass") pool = pool.filter(n => n.clef === "bass");
      if (accidentalFilter === "natural") pool = pool.filter(n => n.accidental === "natural");
      else if (accidentalFilter === "sharp") pool = pool.filter(n => n.accidental === "sharp");
      else if (accidentalFilter === "flat") pool = pool.filter(n => n.accidental === "flat");
      return pool[Math.floor(Math.random() * pool.length)];
    }

    // ============ GRAND STAFF ============
    function GrandStaff({ currentNote, feedback, showNoteName }) {
      const SVG_WIDTH = 320;
      const SVG_HEIGHT = 200;
      const STAFF_LEFT = 60;
      const STAFF_RIGHT = SVG_WIDTH - 20;
      const NOTE_X = 190;

      const y = currentNote ? getNoteY(currentNote.name, currentNote.octave, currentNote.accidental) : 100;
      const ledgerLines = currentNote ? getLedgerLines(currentNote.name, currentNote.octave, currentNote.accidental) : [];
      
      let noteColor = "#1a1a2e";
      if (feedback === "correct") noteColor = "#22c55e";
      if (feedback === "incorrect") noteColor = "#ef4444";

      const stemUp = y > 75;
      const stemX = stemUp ? NOTE_X + 7 : NOTE_X - 7;
      const stemEndY = stemUp ? y - 30 : y + 30;

      const accidentalSymbol = currentNote?.accidental === "sharp" ? "♯" : currentNote?.accidental === "flat" ? "♭" : "";

      return (
        <svg viewBox={`0 0 ${SVG_WIDTH} ${SVG_HEIGHT}`} className="w-full max-w-lg mx-auto" style={{ minHeight: 200 }}>
          <rect x="0" y="0" width={SVG_WIDTH} height={SVG_HEIGHT} fill="white" rx="8" />

          {STAFF_CONFIG.trebleLinesY.map((ly, i) => (
            <line key={`t${i}`} x1={STAFF_LEFT} y1={ly} x2={STAFF_RIGHT} y2={ly} stroke="#64748b" strokeWidth="1" />
          ))}
          {STAFF_CONFIG.bassLinesY.map((ly, i) => (
            <line key={`b${i}`} x1={STAFF_LEFT} y1={ly} x2={STAFF_RIGHT} y2={ly} stroke="#64748b" strokeWidth="1" />
          ))}

          <text x="30" y="85" fontSize="36" fill="#1a1a2e" fontFamily="serif">G</text>
          <text x="30" y="135" fontSize="28" fill="#1a1a2e" fontFamily="serif">F</text>

          {currentNote && (
            <g>
              {ledgerLines.map((ly, i) => (
                <line key={`l${i}`} x1={NOTE_X - 14} y1={ly} x2={NOTE_X + 14} y2={ly} stroke="#1a1a2e" strokeWidth="1" />
              ))}
              
              {accidentalSymbol && (
                <text x={NOTE_X - 22} y={y + 4} fontSize="14" fill="#1a1a2e" textAnchor="middle">
                  {accidentalSymbol}
                </text>
              )}

              <ellipse cx={NOTE_X} cy={y} rx="7" ry="5" fill={noteColor} transform={`rotate(-15 ${NOTE_X} ${y})`} />
              <line x1={stemX} y1={y} x2={stemX} y2={stemEndY} stroke={noteColor} strokeWidth="1.5" />

              {showNoteName && (
                <g>
                  <rect x={NOTE_X + 18} y={y - 10} width="32" height="20" rx="4" fill={feedback === "correct" ? "#22c55e" : feedback === "incorrect" ? "#ef4444" : "#8b5cf6"} />
                  <text x={NOTE_X + 34} y={y + 4} fontSize="13" fontWeight="700" fill="white" textAnchor="middle">
                    {currentNote.name}{currentNote.accidental === "sharp" ? "#" : currentNote.accidental === "flat" ? "b" : ""}
                  </text>
                </g>
              )}
            </g>
          )}
        </svg>
      );
    }

    // ============ PIANO KEYBOARD ============
    function PianoKeyboard({ onKeyClick, highlightedKey, disabled }) {
      const WHITE_KEY_WIDTH = 28;
      const WHITE_KEY_HEIGHT = 100;
      const BLACK_KEY_WIDTH = 18;
      const BLACK_KEY_HEIGHT = 62;

      const whiteNoteOrder = ["C", "D", "E", "F", "G", "A", "B"];
      const whiteKeys = [];
      for (let octave = 2; octave <= 5; octave++) {
        for (let note of whiteNoteOrder) {
          if (octave === 2 && ["C", "D", "E", "F"].includes(note)) continue;
          if (octave === 5 && note === "B") continue;
          whiteKeys.push({ note, octave, isBlack: false });
        }
      }

      const totalWidth = whiteKeys.length * WHITE_KEY_WIDTH;

      const blackKeyPositions = [];
      for (let i = 0; i < whiteKeys.length; i++) {
        const key = whiteKeys[i];
        if (["C", "D", "F", "G", "A"].includes(key.note)) {
          blackKeyPositions.push({ note: key.note + "#", octave: key.octave, afterWhiteIndex: i });
        }
      }

      return (
        <div className="w-full overflow-x-auto">
          <svg viewBox={`0 0 ${totalWidth + 2} ${WHITE_KEY_HEIGHT + 20}`} className="w-full max-w-2xl mx-auto" style={{ minHeight: 120 }}>
            {whiteKeys.map((key, i) => {
              const x = i * WHITE_KEY_WIDTH + 1;
              const isHighlighted = highlightedKey && 
                highlightedKey.note === key.note && 
                highlightedKey.octave === key.octave &&
                !highlightedKey.accidental;
              let fill = "white";
              if (isHighlighted) {
                fill = highlightedKey.type === "correct" ? "#dcfce7" : "#fee2e2";
              }

              return (
                <g key={`w-${key.note}${key.octave}`}>
                  <rect
                    x={x} y={1}
                    width={WHITE_KEY_WIDTH - 1}
                    height={WHITE_KEY_HEIGHT}
                    fill={fill}
                    stroke="#64748b" strokeWidth="1"
                    rx="0" ry="3"
                    style={{ cursor: disabled ? "default" : "pointer" }}
                    onClick={() => !disabled && onKeyClick(key.note, key.octave)}
                  />
                  {key.note === "C" && (
                    <text x={x + WHITE_KEY_WIDTH / 2 - 0.5} y={WHITE_KEY_HEIGHT - 6} fontSize="8" fontWeight="600" fill="#64748b" textAnchor="middle">
                      C{key.octave}
                    </text>
                  )}
                </g>
              );
            })}

            {blackKeyPositions.map((bk) => {
              const whiteX = bk.afterWhiteIndex * WHITE_KEY_WIDTH + 1;
              const x = whiteX + WHITE_KEY_WIDTH - BLACK_KEY_WIDTH / 2;
              const noteName = bk.note.replace("#", "");
              
              const isHighlighted = highlightedKey && 
                highlightedKey.note === noteName && 
                highlightedKey.octave === bk.octave &&
                highlightedKey.accidental === "sharp";

              return (
                <rect
                  key={`b-${bk.note}${bk.octave}`}
                  x={x} y={1}
                  width={BLACK_KEY_WIDTH}
                  height={BLACK_KEY_HEIGHT}
                  fill={isHighlighted ? (highlightedKey.type === "correct" ? "#86efac" : "#fca5a5") : "#1e293b"}
                  stroke="#0f172a" strokeWidth="1"
                  rx="0" ry="2"
                  style={{ cursor: disabled ? "default" : "pointer" }}
                  onClick={() => !disabled && onKeyClick(noteName, bk.octave)}
                />
              );
            })}
          </svg>
        </div>
      );
    }

    // ============ MAIN APP ============
    const TOTAL_ROUNDS = 20;

    function App() {
      const [gameState, setGameState] = useState("menu");
      const [clefFilter, setClefFilter] = useState("both");
      const [accidentalFilter, setAccidentalFilter] = useState("all");
      const [inputMode, setInputMode] = useState("buttons");
      const [selectedOctave, setSelectedOctave] = useState(4);
      const [currentNote, setCurrentNote] = useState(null);
      const [round, setRound] = useState(0);
      const [results, setResults] = useState([]);
      const [feedback, setFeedback] = useState(null);
      const [showNoteName, setShowNoteName] = useState(false);
      const [streak, setStreak] = useState(0);
      const [bestStreak, setBestStreak] = useState(0);
      const roundStartRef = useRef(0);
      const feedbackTimeoutRef = useRef(null);

      const startGame = useCallback(() => {
        setGameState("playing");
        setRound(1);
        setResults([]);
        setStreak(0);
        setBestStreak(0);
        setFeedback(null);
        setShowNoteName(false);
        const note = getRandomNote(clefFilter, accidentalFilter);
        setCurrentNote(note);
        setSelectedOctave(note.octave);
        roundStartRef.current = Date.now();
      }, [clefFilter, accidentalFilter]);

      const nextRound = useCallback(() => {
        if (round >= TOTAL_ROUNDS) {
          setGameState("results");
          return;
        }
        setFeedback(null);
        setShowNoteName(false);
        const note = getRandomNote(clefFilter, accidentalFilter);
        setCurrentNote(note);
        setSelectedOctave(note.octave);
        setRound(r => r + 1);
        roundStartRef.current = Date.now();
      }, [round, clefFilter, accidentalFilter]);

      const handleAnswer = useCallback((answer) => {
        if (!currentNote || feedback) return;

        const timeMs = Date.now() - roundStartRef.current;
        const correct = 
          answer.note === currentNote.name && 
          answer.octave === currentNote.octave &&
          answer.accidental === currentNote.accidental;

        setResults(prev => [...prev, { note: currentNote, answer, correct, timeMs }]);

        if (correct) {
          setFeedback("correct");
          setStreak(s => {
            const newStreak = s + 1;
            setBestStreak(b => Math.max(b, newStreak));
            return newStreak;
          });
        } else {
          setFeedback("incorrect");
          setShowNoteName(true);
          setStreak(0);
        }

        if (feedbackTimeoutRef.current) clearTimeout(feedbackTimeoutRef.current);
        feedbackTimeoutRef.current = setTimeout(() => {
          nextRound();
        }, correct ? 600 : 1200);
      }, [currentNote, feedback, nextRound]);

      useEffect(() => {
        if (gameState !== "playing") return;

        function handleKeyDown(e) {
          const key = e.key.toUpperCase();
          if (NOTE_NAMES.includes(key)) {
            handleAnswer({ note: key, octave: selectedOctave, accidental: currentNote?.accidental ?? "natural" });
          }
        }

        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [gameState, handleAnswer, selectedOctave, currentNote]);

      useEffect(() => {
        return () => {
          if (feedbackTimeoutRef.current) clearTimeout(feedbackTimeoutRef.current);
        };
      }, []);

      // ============ MENU ============
      if (gameState === "menu") {
        return (
          <div className="min-h-screen bg-gradient-to-b from-indigo-950 to-slate-900 flex items-center justify-center p-4">
            <div className="w-full max-w-md">
              <div className="text-center mb-8">
                <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-violet-600 mb-4">
                  <svg viewBox="0 0 24 24" className="w-8 h-8 text-white" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M9 18V5l12-2v13" />
                    <circle cx="6" cy="18" r="3" />
                    <circle cx="18" cy="16" r="3" />
                  </svg>
                </div>
                <h1 className="text-3xl font-bold text-white mb-2">Speed-Trainer</h1>
                <p className="text-slate-400 text-sm">Test your speed at identifying notes on the grand staff</p>
              </div>

              <div className="bg-slate-800 rounded-xl p-6 space-y-5 border border-slate-700">
                <div>
                  <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Clef Range</label>
                  <div className="grid grid-cols-3 gap-2">
                    {(["both", "treble", "bass"]).map((f) => (
                      <button key={f} onClick={() => setClefFilter(f)}
                        className={`px-3 py-2 rounded-lg text-sm font-medium transition-all ${
                          clefFilter === f ? "bg-violet-600 text-white" : "bg-slate-700 text-slate-400 hover:bg-slate-600"
                        }`}>
                        {f === "both" ? "Both" : f === "treble" ? "Treble" : "Bass"}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Accidentals</label>
                  <div className="grid grid-cols-4 gap-2">
                    {(["all", "natural", "sharp", "flat"]).map((f) => (
                      <button key={f} onClick={() => setAccidentalFilter(f)}
                        className={`px-3 py-2 rounded-lg text-sm font-medium transition-all ${
                          accidentalFilter === f ? "bg-violet-600 text-white" : "bg-slate-700 text-slate-400 hover:bg-slate-600"
                        }`}>
                        {f === "all" ? "All" : f === "natural" ? "Natural" : f === "sharp" ? "Sharps" : "Flats"}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Answer With</label>
                  <div className="grid grid-cols-2 gap-2">
                    {(["buttons", "keyboard"]).map((m) => (
                      <button key={m} onClick={() => setInputMode(m)}
                        className={`px-3 py-2 rounded-lg text-sm font-medium transition-all ${
                          inputMode === m ? "bg-violet-600 text-white" : "bg-slate-700 text-slate-400 hover:bg-slate-600"
                        }`}>
                        {m === "buttons" ? "Note Buttons" : "Piano Keys"}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="pt-1">
                  <p className="text-xs text-slate-500 mb-3 text-center">
                    {TOTAL_ROUNDS} notes - Identify note name + octave - Use keyboard (A-G) for speed
                  </p>
                  <button onClick={startGame}
                    className="w-full py-3 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-semibold text-lg transition-all active:scale-[0.98]">
                    Start Game
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ============ RESULTS ============
      if (gameState === "results") {
        const correctCount = results.filter(r => r.correct).length;
        const accuracy = Math.round((correctCount / results.length) * 100);
        const correctResults = results.filter(r => r.correct);
        const avgTime = correctResults.length > 0 ? Math.round(correctResults.reduce((sum, r) => sum + r.timeMs, 0) / correctResults.length) : 0;
        const fastestTime = correctResults.length > 0 ? Math.min(...correctResults.map(r => r.timeMs)) : 0;

        let grade = "Keep Practicing";
        let gradeColor = "text-red-500";
        if (accuracy >= 95 && avgTime < 2000) { grade = "Master"; gradeColor = "text-amber-500"; }
        else if (accuracy >= 85 && avgTime < 3000) { grade = "Expert"; gradeColor = "text-violet-400"; }
        else if (accuracy >= 70) { grade = "Getting There"; gradeColor = "text-green-500"; }

        return (
          <div className="min-h-screen bg-gradient-to-b from-indigo-950 to-slate-900 flex items-center justify-center p-4">
            <div className="w-full max-w-md">
              <div className="text-center mb-6">
                <h2 className={`text-3xl font-bold mb-1 ${gradeColor}`}>{grade}</h2>
                <p className="text-slate-400 text-sm">Round Complete</p>
              </div>

              <div className="bg-slate-800 rounded-xl p-6 border border-slate-700 space-y-4">
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-slate-700 rounded-lg p-4 text-center">
                    <div className="text-2xl font-bold text-white">{accuracy}%</div>
                    <div className="text-xs text-slate-400">Accuracy</div>
                  </div>
                  <div className="bg-slate-700 rounded-lg p-4 text-center">
                    <div className="text-2xl font-bold text-white">{avgTime > 0 ? (avgTime / 1000).toFixed(1) + "s" : "-"}</div>
                    <div className="text-xs text-slate-400">Avg Time</div>
                  </div>
                  <div className="bg-slate-700 rounded-lg p-4 text-center">
                    <div className="text-2xl font-bold text-green-500">{correctCount}/{results.length}</div>
                    <div className="text-xs text-slate-400">Correct</div>
                  </div>
                  <div className="bg-slate-700 rounded-lg p-4 text-center">
                    <div className="text-2xl font-bold text-amber-500">{fastestTime > 0 ? (fastestTime / 1000).toFixed(1) + "s" : "-"}</div>
                    <div className="text-xs text-slate-400">Fastest</div>
                  </div>
                </div>

                <div className="pt-1">
                  <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Best Streak: {bestStreak}</div>
                  <div className="space-y-1 max-h-48 overflow-y-auto">
                    {results.map((r, i) => (
                      <div key={i} className={`flex items-center justify-between px-3 py-1.5 rounded text-xs ${
                        r.correct ? "bg-green-900/50 text-green-300" : "bg-red-900/50 text-red-300"
                      }`}>
                        <span className="font-medium">
                          {r.note.name}{r.note.octave}{r.note.accidental === "sharp" ? "#" : r.note.accidental === "flat" ? "b" : ""} ({r.note.clef})
                        </span>
                        <span>
                          {r.correct ? (r.timeMs / 1000).toFixed(1) + "s" : `You said ${r.answer.note}${r.answer.octave}`}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2 pt-2">
                  <button onClick={startGame}
                    className="py-2.5 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-semibold transition-all active:scale-[0.98]">
                    Play Again
                  </button>
                  <button onClick={() => setGameState("menu")}
                    className="py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold transition-all active:scale-[0.98]">
                    Menu
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ============ PLAYING ============
      const correctSoFar = results.filter(r => r.correct).length;

      return (
        <div className="min-h-screen bg-gradient-to-b from-indigo-950 to-slate-900 flex flex-col">
          <div className="flex items-center justify-between px-4 py-3 border-b border-slate-800">
            <div className="flex items-center gap-3">
              <span className="text-sm font-semibold text-slate-400">{round}/{TOTAL_ROUNDS}</span>
              <div className="w-32 h-1.5 bg-slate-700 rounded-full overflow-hidden">
                <div className="h-full bg-violet-600 rounded-full transition-all" style={{ width: `${(round / TOTAL_ROUNDS) * 100}%` }} />
              </div>
            </div>
            <div className="flex items-center gap-4">
              <span className="text-sm text-green-500 font-semibold">{correctSoFar} correct</span>
              {streak > 1 && <span className="text-sm text-amber-500 font-semibold animate-pulse">{streak} streak</span>}
            </div>
          </div>

          <div className="flex-1 flex flex-col items-center justify-center p-4 gap-6">
            <div className="w-full max-w-lg">
              <div className="text-center mb-3">
                <p className="text-slate-500 text-sm">What note is this?</p>
              </div>
              <div className="bg-slate-800 rounded-xl p-4 border border-slate-700">
                <GrandStaff currentNote={currentNote} feedback={feedback} showNoteName={showNoteName} />
              </div>
            </div>

            {inputMode === "buttons" ? (
              <div className="w-full max-w-lg">
                <div className="mb-3">
                  <label className="block text-xs text-slate-500 mb-1 text-center">Octave: {selectedOctave}</label>
                  <div className="flex justify-center gap-1">
                    {[2,3,4,5].map(oct => (
                      <button key={oct} onClick={() => setSelectedOctave(oct)} disabled={!!feedback}
                        className={`px-2 py-1 rounded text-xs font-medium transition-all ${
                          selectedOctave === oct ? "bg-violet-600 text-white" : "bg-slate-700 text-slate-400 hover:bg-slate-600"
                        }`}>
                        {oct}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="grid grid-cols-7 gap-2">
                  {NOTE_NAMES.map(name => {
                    let btnClass = "py-4 rounded-xl font-bold text-lg transition-all active:scale-95 ";
                    const noteMatches = feedback && currentNote && name === currentNote.name && selectedOctave === currentNote.octave;
                    if (feedback && currentNote) {
                      if (noteMatches) btnClass += "bg-green-500 text-white ";
                      else if (name === currentNote.name) btnClass += "bg-amber-500 text-white ";
                      else btnClass += "bg-slate-700 text-slate-400 ";
                    } else {
                      btnClass += "bg-slate-700 text-white hover:bg-slate-600 ";
                    }
                    return (
                      <button key={name} onClick={() => handleAnswer({ note: name, octave: selectedOctave, accidental: currentNote?.accidental ?? "natural" })} disabled={!!feedback} className={btnClass}>
                        {name}
                      </button>
                    );
                  })}
                </div>
                <p className="text-center text-xs text-slate-500 mt-2">or press A-G on your keyboard</p>
              </div>
            ) : (
              <div className="w-full max-w-2xl bg-slate-800 rounded-xl p-4 border border-slate-700">
                <PianoKeyboard
                  onKeyClick={(note, octave) => handleAnswer({ note, octave, accidental: currentNote?.accidental ?? "natural" })}
                  highlightedKey={feedback && currentNote ? { note: currentNote.name, octave: currentNote.octave, accidental: currentNote.accidental, type: feedback === "correct" ? "correct" : "incorrect" } : null}
                  disabled={!!feedback}
                />
                <p className="text-center text-xs text-slate-500 mt-2">Click the correct key or press A-G on your keyboard</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============ RENDER ============
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
